# Mu Reforge web client on its own VPS (WEB_VPS_IP). Lives in /opt/mureforge-webclient/ with
# .env, proxy.env and serverlist.md beside it (runbook.md, W9).
#
# Both containers publish on 127.0.0.1 ONLY: the host nginx (nginx/host/*.conf) is the public
# door and holds the TLS certificate, the security headers, the per-address limits and the
# Origin check. Docker's published ports bypass ufw, so a 0.0.0.0 publish here would be open to
# the internet whatever ufw says - keep the 127.0.0.1 prefix.
#
# Images are built in CI and pulled here, never built on this box:
#   docker compose pull && docker compose up -d
#
# Sizes assume a 4 vCPU / 8 GB box (Contabo Cloud VPS 10); .env can override them.
name: mureforge-webclient

services:

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE in .env}
    container_name: mureforge-webclient-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8731}:80"
    volumes:
      # The published world list, editable on the box without a new image (serverlist.md).
      - ./serverlist.md:/usr/share/nginx/html/serverlist.md:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    # nginx's master starts as root, binds :80, chowns its temp dirs and drops to the nginx user
    # for the workers: exactly these four, nothing else.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    pids_limit: 128
    cpus: ${WEB_CPUS:-1.5}
    mem_limit: ${WEB_MEM:-512m}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  proxy:
    image: ${PROXY_IMAGE:?set PROXY_IMAGE in .env}
    container_name: mureforge-webclient-proxy
    restart: unless-stopped
    env_file: ./proxy.env
    ports:
      - "127.0.0.1:${PROXY_PORT:-8730}:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Two sockets per player (websocket in, TCP out). Docker's default soft limit of 1024 is
    # about 500 players; the game server compose learned this the hard way (see its ulimits).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Bun's threads plus headroom; a fork bomb or a runaway spawn stops here.
    pids_limit: 256
    cpus: ${PROXY_CPUS:-2}
    # A memory kill drops EVERY web player at once; the proxy's own per-socket backpressure
    # limits (proxy.Dockerfile defaults) are what keep it far below this.
    mem_limit: ${PROXY_MEM:-1g}
    # Bun exits on SIGTERM and the kernel closes every TCP socket: the game server sees an
    # ordinary disconnect and saves each player through its logout path. 30 s is plenty.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
