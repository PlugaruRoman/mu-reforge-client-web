# Mu Reforge web client on its own VPS (WEB_VPS_IP). Lives in /opt/mureforge-webclient/ with
# .env, proxy.env and serverlist.md beside it (runbook.md, W9).
#
# Both containers publish on 127.0.0.1 ONLY: the host nginx (nginx/host/*.conf) is the public
# door and holds the TLS certificate, the security headers, the per-address limits and the
# Origin check. Docker's published ports bypass ufw, so a 0.0.0.0 publish here would be open to
# the internet whatever ufw says - keep the 127.0.0.1 prefix.
#
# Images are built in CI and pulled here, never built on this box:
#   docker compose pull && docker compose up -d
#
# Sizes assume a 4 vCPU / 8 GB box (Contabo Cloud VPS 10); .env can override them.
name: mureforge-webclient

services:

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE in .env}
    container_name: mureforge-webclient-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8731}:80"
    volumes:
      # The published world list, editable on the box without a new image (serverlist.md).
      - ./serverlist.md:/usr/share/nginx/html/serverlist.md:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    # nginx's master starts as root, binds :80, chowns its temp dirs and drops to the nginx user
    # for the workers: exactly these four, nothing else.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    pids_limit: 128
    cpus: ${WEB_CPUS:-1.5}
    mem_limit: ${WEB_MEM:-512m}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  proxy:
    image: ${PROXY_IMAGE:?set PROXY_IMAGE in .env}
    container_name: mureforge-webclient-proxy
    restart: unless-stopped
    env_file: ./proxy.env
    ports:
      - "127.0.0.1:${PROXY_PORT:-8730}:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Two sockets per player (websocket in, TCP out). Docker's default soft limit of 1024 is
    # about 500 players; the game server compose learned this the hard way (see its ulimits).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Bun's threads plus headroom; a fork bomb or a runaway spawn stops here.
    pids_limit: 256
    cpus: ${PROXY_CPUS:-2}
    # A memory kill drops EVERY web player at once, so this must hold the WORST case, not the
    # usual one (the old 1g was OOM at about 450 sockets with full buffers). Worst case with the
    # defaults of proxy/relayLimits.ts:
    #   application buffers per relay socket  WS_BACKPRESSURE_LIMIT 512 KiB + TCP_QUEUE_LIMIT
    #                                         256 KiB + PRE_OPEN_LIMIT 16 KiB      = 784 KiB
    #   kernel socket buffers (cgroup v2 charges them here), 2 sockets per relay
    #   (websocket in, TCP out), ~256 KiB each when both are backed up            ~ 512 KiB
    #   per relay                                                                  ~ 1.3 MiB
    #   x MAX_SOCKETS_TOTAL 2000 (the proxy refuses the 2001st, nginx's total
    #   is the same 2000)                                                          ~ 2.5 GiB
    #   + Bun's heap and runtime                                                   ~ 0.3 GiB
    #                                                                              ~ 2.8 GiB  -> 3g
    # Raising MAX_SOCKETS_TOTAL or a buffer limit means redoing this sum (and the 8 GB box has to
    # keep room for nginx, the web container and the page cache).
    mem_limit: ${PROXY_MEM:-3g}
    # Bun exits on SIGTERM and the kernel closes every TCP socket: the game server sees an
    # ordinary disconnect and saves each player through its logout path. 30 s is plenty.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

# Pinned, so the proxy can trust X-Real-IP from exactly one peer: host nginx reaches the published
# 127.0.0.1 ports through this network's gateway, 172.31.250.1 (proxy.Dockerfile TRUSTED_PROXIES),
# and the web container (172.31.250.x) is not believed. If `docker compose up` says the pool
# overlaps another network, pick another /24, set its gateway here AND TRUSTED_PROXIES in
# proxy.env to that gateway (runbook.md, W6).
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1
