# nginx INSIDE the web image (web.Dockerfile). It only serves files; TLS, HSTS and the public
# limits live in the host's nginx (nginx/host/web.mureforge.com.conf), which proxies here.
#
# Three cache classes:
#   - the entry points (index.html, sw.js, build.json, serverlist.md, manifest): no-cache,
#     so a deploy is seen on the next load (src/app/buildCheck.ts compares build.json);
#   - vite's hashed bundles under /assets/: immutable for a year;
#   - game data under fixed names (Data/, game-assets/, packs/, items/ ...): a day, with ETag.
#     The asset worker (public/sw.js) revalidates each of them once per build anyway.
#
# A missing file is a plain 404, never index.html: the client decodes BMD / GLB / .gz bytes,
# and an HTML page with status 200 reads as garbage (src/controllers/assets/compressedAssets.ts).

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The host proxy is the only client; trust its address for the logs.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    # Text compresses on the fly. The game data is either pre-compressed (.gz sidecars) or
    # already compressed (OZJ = JPEG, mp3, ogg), so it is not on the list.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json
               application/manifest+json image/svg+xml text/plain text/markdown;

    add_header X-Content-Type-Options nosniff always;

    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /index.html =404;
    }

    location ~ ^/(index\.html|sw\.js|build\.json|serverlist\.md|server\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # vite's content-hashed output.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Game data with fixed names: the same prefixes public/sw.js handles.
    location ~ ^/(Data|Data-v097d|game-assets|game-assets-v097d|packs|packs-v097d|items)/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;

        # gzip sidecars are served as opaque bytes. NO Content-Encoding: the client unpacks them
        # itself with DecompressionStream, and a browser-unwrapped body would be decoded twice.
        location ~ \.gz$ {
            types { }
            default_type application/octet-stream;
            gzip off;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        try_files $uri =404;
    }

    # The shop and marketplace services are not deployed; answer their relative paths quickly.
    location /api/ {
        return 404;
    }

    location / {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
