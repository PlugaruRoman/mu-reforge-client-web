# HOST nginx on the web client VPS (WEB_VPS_IP): https://web.mureforge.com - the static client.
# Install to /etc/nginx/sites-available/ and link into sites-enabled (runbook.md, W8).
# Terminates TLS and proxies to the web container on loopback (compose.yml, WEB_PORT 8731).
# Cache headers come from the container (nginx/web-container.conf) and pass through unchanged;
# the security headers are set here, the public door.
#
# Written for Ubuntu 24.04's nginx 1.24: `listen ... http2` (the `http2 on;` directive needs
# 1.25.1+). IPv4 only on purpose: the per-address limits key on the whole address, and an IPv6
# client holds a /64 of them (runbook.md, "Decisions"). Add AAAA records only together with
# limits keyed on the /64.

# Per address. A first visit (the pre-download screen, or the first walk into a map) fetches
# hundreds of files in parallel, all multiplexed over one HTTP/2 connection, and nginx counts
# every stream against limit_conn. A 429 here is not cosmetic: the client then drops the gzip
# sidecars for the whole session (compressedAssets.ts) or fails a model outright. So the limits
# only stop a single address from flooding; bandwidth is what limit_rate is for, if ever needed.
limit_req_zone  $binary_remote_addr zone=mu_web_req:10m rate=300r/s;
limit_conn_zone $binary_remote_addr zone=mu_web_conn:10m;

upstream mu_web_static {
    server 127.0.0.1:8731;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name web.mureforge.com;

    ssl_certificate     /etc/letsencrypt/live/mureforge-webclient/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mureforge-webclient/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:MU_WEB_SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # The container already compressed what is worth compressing (text on the fly, game data as
    # .gz sidecars served as opaque bytes). Re-encoding here would only cost CPU - and a sidecar
    # must reach the browser byte for byte, without Content-Encoding.
    gzip off;

    # --- Security headers (`always`: on 404 and 429 too). No location below sets add_header,
    # so every response inherits these.
    # Not includeSubDomains: other mureforge.com hosts are not ours to pin here.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # frame-ancestors below says the same; this one is enforced while the CSP is Report-Only.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Content-Security-Policy, REPORT-ONLY during the beta: violations show in the browser console
    # (no report endpoint), nothing is blocked. Switch the header name to
    # `Content-Security-Policy` once a beta week shows no violation in normal play (runbook.md,
    # "After the beta") - only then does it close the phishing link `?ws=wss://evil...` (a world
    # profile taken from the URL): connect-src is what stops the page from talking to any other
    # relay. Every source, and why:
    #   connect-src  'self' (Data/, game-assets*, build.json, serverlist.md, server.json of a
    #                directLogin world), wss://ws.mureforge.com (the relay),
    #                https://ws.mureforge.com (its /server.json, serverManifest.ts),
    #                https://api.github.com (the credits' contributor lists - licence, keep),
    #                blob: data: (Babylon reads textures and glTF buffers through fetch/XHR).
    #   script-src   'self' + 'wasm-unsafe-eval' (Draco, KTX2/Basis transcoders, zstd: all
    #                self-hosted under /js/) + blob: (streamed first-party modules are imported
    #                from a blob URL, src/modules/_api/streamPorts.ts; so is the KTX2/Basis
    #                transcoder's Emscripten glue, src/controllers/assets/ktx2Pixels.ts).
    #                NO 'unsafe-eval': nothing in src/ or versions/ calls eval or new Function
    #                (ktx2Pixels.ts did until wave 4 and now imports from a blob URL instead).
    #                If a CSP report ever names eval, fix the caller rather than add it.
    #   worker-src   'self' (asset worker sw.js, terrain parser, background tick) + blob:
    #                (Babylon starts its decoder workers from blob URLs).
    #   img-src / media-src  'self' data: blob: (sprites, icons and effect sheets are decoded
    #                into blob URLs; music is a same-origin file).
    #   style-src    'unsafe-inline' (index.html's inline <style>, React style attributes).
    #   frame-src    'self' blob: (sandboxed module frames, src/modules/_api/sandbox.ts).
    # Deliberately absent: cdn.babylonjs.com (the debug Inspector, Shift+Ctrl+Alt+I - a dev tool,
    # fails closed) and raw.githubusercontent.com (the upstream world list - our build sets
    # VITE_SERVER_LIST_URL, so it is never fetched).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' wss://ws.mureforge.com https://ws.mureforge.com https://api.github.com blob: data:; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    limit_req  zone=mu_web_req burst=3000 nodelay;
    limit_conn mu_web_conn 512;
    limit_req_status  429;
    limit_conn_status 429;

    # Slow or idle connections (see ws.mureforge.com.conf): 10 s for headers (and a slow TLS
    # handshake) and bodies, 30 s idle keep-alive, 30 s for a client that stops reading.
    client_header_timeout 10s;
    client_body_timeout   10s;
    keepalive_timeout     30s;
    send_timeout          30s;

    access_log /var/log/nginx/mureforge-web.access.log;
    error_log  /var/log/nginx/mureforge-web.error.log warn;

    location / {
        proxy_pass http://mu_web_static;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Set, never appended: a client-sent X-Forwarded-For must not reach the container's logs.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Music and models are large; stream them instead of spooling to disk.
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 60s;
    }

    # The game data trees (web-container.conf's same list): the ~450 MB of a first visit. 4 MB/s
    # per response: a real download is hundreds of small files in parallel and never notices,
    # while one address looping the big files cannot run the port and the monthly traffic
    # allowance dry (runbook.md, "Cloudflare" caches these instead). With HTTP/2 the rate is per
    # stream, not per connection - this caps a file, the 512-connection limit caps the rest.
    location ~ ^/(Data|Data-v097d|Data-reforge|game-assets|game-assets-v097d|game-assets-reforge|packs|packs-v097d|items)/ {
        limit_rate 4m;
        proxy_pass http://mu_web_static;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 60s;
    }
}
