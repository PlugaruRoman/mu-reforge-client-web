# HOST nginx on the web box: https://web.mureforge.com - the static web client.
# Terminates TLS and proxies to the web container on loopback (compose.yml, WEB_BIND).
# Cache headers come from the container (nginx/web-container.conf) and pass through unchanged.
#
# Zone and variable names carry a "mu_" prefix: this box has other vhosts (the website, its
# API, another tenant) and nginx refuses to load two zones or maps with one name.

limit_req_zone  $binary_remote_addr zone=mu_web_req:10m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=mu_web_conn:10m;

upstream mu_web_static {
    server 127.0.0.1:8731;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web.mureforge.com;

    ssl_certificate     /etc/letsencrypt/live/mureforge-webclient/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mureforge-webclient/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:MU_WEB_SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # Not includeSubDomains: other mureforge.com hosts are not ours to pin here.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # A first load pulls a few thousand files (the pre-download screen fetches in parallel), so
    # the request rate is generous; the connection cap stops one address from hogging workers.
    limit_req  zone=mu_web_req burst=600 nodelay;
    limit_conn mu_web_conn 64;
    limit_req_status  429;
    limit_conn_status 429;

    access_log /var/log/nginx/mureforge-web.access.log;
    error_log  /var/log/nginx/mureforge-web.error.log warn;

    location / {
        proxy_pass http://mu_web_static;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Music and models are large; stream them instead of spooling to disk.
        proxy_buffering on;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 60s;
    }
}
