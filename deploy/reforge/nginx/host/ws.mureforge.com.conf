# HOST nginx on the web client VPS (WEB_VPS_IP): wss://ws.mureforge.com - the WebSocket <-> TCP
# proxy. Install to /etc/nginx/sites-available/ and link into sites-enabled (runbook.md, W8).
# Terminates TLS and forwards to the proxy container on loopback (compose.yml, PROXY_PORT 8730).
#
# Until the server release with PROXY protocol support is live and PROXY_PROTOCOL=v2 is set
# (runbook.md, S5), every web player reaches the game server as WEB_VPS_IP, so the limits below
# are the only per-person limits web players have. Afterwards the game server sees the real
# address that nginx puts into X-Real-IP here - which is why it is SET from $remote_addr and
# never taken from the client: whatever a browser sends as X-Real-IP or X-Forwarded-For is
# overwritten before it reaches the proxy.

map $http_upgrade $mu_ws_connection_upgrade {
    default upgrade;
    ''      close;
}

# Browsers always send Origin on a websocket. Only our own client page may open the relay;
# a script can forge the header, so this keeps other sites from embedding it, nothing more.
map $http_origin $mu_ws_origin_ok {
    default                     0;
    "https://web.mureforge.com" 1;
}

# One player holds 1-2 sockets (connect server, then game server; the server-list probe opens a
# short one per listed world). 50 per address leaves room for an internet cafe or a carrier-grade
# NAT with a dozen players behind one address.
limit_conn_zone $binary_remote_addr zone=mu_ws_conn:10m;
# New sockets per address: a reconnect loop or a scripted flood is cut here, not at the game.
# 120/min with a burst of 60 lets a room of players log in at once (probe + CS + GS + a retry).
limit_req_zone  $binary_remote_addr zone=mu_ws_open:10m rate=120r/m;
# The whole relay, all addresses together: a ceiling far above expected load, below the game
# servers' own capacity, so a flood saturates nginx and not the game. Needs worker_connections
# well above 2 x 3000 (runbook.md, W6).
limit_conn_zone $server_name zone=mu_ws_total:1m;

upstream mu_ws_proxy {
    server 127.0.0.1:8730;
}

server {
    listen 443 ssl;
    server_name ws.mureforge.com;

    ssl_certificate     /etc/letsencrypt/live/mureforge-webclient/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mureforge-webclient/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:MU_WS_SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_conn_status 429;
    limit_req_status  429;

    access_log /var/log/nginx/mureforge-ws.access.log;
    error_log  /var/log/nginx/mureforge-ws.error.log warn;

    # The world's settings (proxy/serverManifest.ts), fetched cross-origin by the client; the
    # proxy sets Access-Control-Allow-Origin itself. Also the uptime check's URL.
    location = /server.json {
        limit_req zone=mu_ws_open burst=60 nodelay;
        proxy_pass http://mu_ws_proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
    }

    location = / {
        if ($mu_ws_origin_ok = 0) {
            return 403;
        }

        limit_conn mu_ws_conn 50;
        limit_conn mu_ws_total 3000;
        limit_req  zone=mu_ws_open burst=60 nodelay;

        proxy_pass http://mu_ws_proxy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mu_ws_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # A game session is one long-lived socket. nginx closes it after this much silence in
        # one direction; the game client talks every few seconds, so a day only ever ends dead
        # sockets. A reload (certbot renewal) keeps open sockets on the old workers.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_socket_keepalive on;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
