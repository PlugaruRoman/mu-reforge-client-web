# HOST nginx on the web box (84.247.161.247): plain HTTP for web. and ws.mureforge.com.
# Install to /etc/nginx/sites-available/ and link into sites-enabled (runbook.md, step W3).
#
# Installed FIRST and alone: it answers the Let's Encrypt HTTP-01 challenge from a webroot,
# so the certificate can be issued before the HTTPS vhosts (which reference it) exist.
# Afterwards it stays: renewals use the same path, everything else is redirected to HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name web.mureforge.com ws.mureforge.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
