# HOST nginx on the web client VPS (WEB_VPS_IP): plain HTTP for web. and ws.mureforge.com, plus
# the catch-all default servers. Install to /etc/nginx/sites-available/ and link into
# sites-enabled (runbook.md, W7).
#
# Installed FIRST and alone (with Ubuntu's `default` site removed): it answers the Let's Encrypt
# HTTP-01 challenge from a webroot, so the certificate can be issued before the HTTPS vhosts
# (which reference it) exist. Afterwards it stays: renewals use the same path, everything else
# is redirected to HTTPS.

# Anything that is not one of our names - scanners hitting the bare IP, a stale DNS record of
# someone else - gets the connection closed, never our page.
#
# The listen backlogs live here, on the default servers: a listen OPTION (backlog=...) may appear
# only once per address:port, and every other vhost on :80/:443 shares this socket. 4096 pending
# connections (the kernel default is 511) need `net.core.somaxconn = 4096` (runbook.md, P7), or the
# kernel silently caps the queue at somaxconn.
server {
    listen 80 default_server backlog=4096;
    server_name _;
    client_header_timeout 10s;
    return 444;
}

server {
    listen 443 ssl default_server backlog=4096;
    server_name _;
    # The TLS handshake runs before SNI picks a vhost, so ITS timeout is this server's
    # client_header_timeout: 10 s instead of the 60 s default that let a few addresses park
    # thousands of half-open handshakes.
    client_header_timeout 10s;
    keepalive_timeout     30s;
    # No certificate needed: the TLS handshake for an unknown name is refused (nginx 1.19.4+).
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name web.mureforge.com ws.mureforge.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
