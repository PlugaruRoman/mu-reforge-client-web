# Builds the Mu Reforge web client images and pushes them to the GitHub container registry, so
# the web client VPS never builds anything (the client build needs the whole Data/ tree and GBs
# of scratch space next to live players). On that box, deploying is then:
#
#   docker compose pull && docker compose up -d
#
# with WEB_IMAGE / PROXY_IMAGE in /opt/mureforge-webclient/.env pointing at the sha tags below.
# Runbook: deploy/reforge/runbook.md.
name: reforge images

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'versions/**'
      - 'public/**'
      - 'Data/**'
      - 'Data-v097d/**'
      - 'Data-reforge/**'
      # Covered by public/** already; named so a narrowing of that line cannot drop it.
      - 'public/game-assets-reforge/**'
      - 'tools/**'
      - 'proxy/**'
      - 'index.html'
      - 'index.d.ts'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'package.json'
      - 'bun.lock'
      - 'deploy/reforge/**'
      # Docs only: no image changes with them.
      - '!deploy/reforge/runbook.md'
      - '!deploy/reforge/readme.md'
      - '.github/workflows/reforge-images.yml'
  workflow_dispatch:

concurrency:
  # A newer commit makes an in-flight build obsolete; don't pay for both.
  group: reforge-images
  cancel-in-progress: true

jobs:
  proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/proxy
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/reforge/proxy.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,scope=proxy,mode=max

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The build stage holds node_modules, Data/ and dist/ with its gzip sidecars at once; the
      # stock runner is tight on disk for that, so the toolchains this job never uses go first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Only the dependency stage is worth caching: the Data/ and dist/ layers are GBs and change
      # with every content commit, so caching them (mode=max on the real build) would evict
      # everything else from the 10 GB Actions cache, and mode=min would cache the final image's
      # layers - the dist copy - and not bun install at all. So the `deps` target is built
      # (and cached) on its own first; the real build below finds it in the same builder.
      - name: Cache dependencies
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/reforge/web.Dockerfile
          target: deps
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=web-deps
          cache-to: type=gha,scope=web-deps,mode=max,ignore-error=true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/reforge/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the bundle (vite). Repository variables override the production defaults
          # without editing this file: Settings -> Secrets and variables -> Actions -> Variables.
          # The register URL default stays here AND in web.Dockerfile: an empty repository
          # variable falls back through `||` to it.
          # VITE_PINNED_WORLD=on pins the page to the serverlist's world and ignores URL overrides
          # (web.Dockerfile); only a repository variable set to `off` turns it off.
          build-args: |
            VITE_PINNED_WORLD=${{ vars.REFORGE_PINNED_WORLD || 'on' }}
            VITE_WS_HOST=${{ vars.REFORGE_WS_HOST || 'wss://ws.mureforge.com' }}
            VITE_WS_PORT=${{ vars.REFORGE_WS_PORT || '443' }}
            VITE_CS_HOST=${{ vars.REFORGE_CS_HOST || 'play.mureforge.com' }}
            VITE_CS_PORT=${{ vars.REFORGE_CS_PORT || '44406' }}
            VITE_SERVER_LIST_URL=${{ vars.REFORGE_SERVER_LIST_URL || 'https://web.mureforge.com/serverlist.md' }}
            VITE_REGISTER_URL=${{ vars.REFORGE_REGISTER_URL || 'https://mureforge.com/register' }}
            GITHUB_SHA=${{ github.sha }}
          # No cache-to: the deps stage is cached by the step above, nothing else is worth it.
          cache-from: type=gha,scope=web-deps
