# Builds the Mu Reforge web client images and pushes them to the GitHub container registry, so
# the web box never builds anything (the client build needs the whole Data/ tree and GBs of
# scratch space next to a live website). On the web box, deploying is then:
#
#   docker compose pull && docker compose up -d
#
# with WEB_IMAGE / PROXY_IMAGE in /opt/mureforge-webclient/.env pointing at the sha tags below.
# Runbook: deploy/reforge/runbook.md.
name: reforge images

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'versions/**'
      - 'public/**'
      - 'Data/**'
      - 'Data-v097d/**'
      - 'tools/**'
      - 'proxy/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'bun.lock'
      - 'deploy/reforge/**'
      - '.github/workflows/reforge-images.yml'
  workflow_dispatch:

concurrency:
  # A newer commit makes an in-flight build obsolete; don't pay for both.
  group: reforge-images
  cancel-in-progress: true

jobs:
  proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/proxy
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/reforge/proxy.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,scope=proxy,mode=max

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The build stage holds node_modules, Data/ and dist/ with its gzip sidecars at once; the
      # stock runner is tight on disk for that, so the toolchains this job never uses go first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/reforge/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the bundle (vite). Repository variables override the production defaults
          # without editing this file: Settings -> Secrets and variables -> Actions -> Variables.
          build-args: |
            VITE_WS_HOST=${{ vars.REFORGE_WS_HOST || 'wss://ws.mureforge.com' }}
            VITE_WS_PORT=${{ vars.REFORGE_WS_PORT || '443' }}
            VITE_CS_HOST=${{ vars.REFORGE_CS_HOST || 'play.mureforge.com' }}
            VITE_CS_PORT=${{ vars.REFORGE_CS_PORT || '44406' }}
            VITE_SERVER_LIST_URL=${{ vars.REFORGE_SERVER_LIST_URL || 'https://web.mureforge.com/serverlist.md' }}
            VITE_REGISTER_URL=${{ vars.REFORGE_REGISTER_URL || 'https://mureforge.com/register' }}
            GITHUB_SHA=${{ github.sha }}
          # Only the dependency layer is worth caching: the Data/ and dist/ layers are GBs and
          # change with every content commit, which would evict everything else from the cache.
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=min
